name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Sign, Package & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci

      - name: Quality Gate — TypeScript
        run: npm run typecheck

      - name: Quality Gate — ESLint
        run: npm run lint

      - name: Quality Gate — Test Suite (100% Pass Required)
        run: npm test

      - name: Quality Gate — Security Audit
        run: npm audit --audit-level=high

      - name: Production Build
        run: npm run build

      - name: Package Multi-Platform Distribution
        run: npm run package

      - name: Verify Packaged Distribution Isolation
        run: npm run verify:package

      - name: Generate Release Notes & Manifest
        run: |
          echo "Release tag: ${{ github.ref_name }}" >> release-notes.md
          cat release/release-manifest.json >> release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
