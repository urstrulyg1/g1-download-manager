<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }
    .title { font-size: 15px; font-weight: 700; color: #fff; }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .status-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-offline { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .metric-label { color: #94a3b8; }
    .metric-val { font-family: monospace; font-weight: bold; color: #38bdf8; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .2s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(16px); }
    .btn-main {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity .15s;
    }
    .btn-main:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="G1DM" width="28" height="28" style="object-fit: contain; filter: drop-shadow(0 2px 6px rgba(52,211,153,0.3));">
      <span class="title">G1DM Companion</span>
    </div>
    <span id="daemonStatus" class="status-badge status-offline">Connecting</span>
  </div>

  <div class="metric-row">
    <span class="metric-label">Engine Throughput</span>
    <span id="currentSpeed" class="metric-val">0.0 MB/s</span>
  </div>

  <div class="toggle-row">
    <span>Download Interception</span>
    <label class="switch">
      <input type="checkbox" id="interceptToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="downloadCurrentBtn" class="btn-main" style="background: linear-gradient(135deg, #10b981, #059669); border-color: rgba(16, 185, 129, 0.4); margin-top: 10px;">
    <span>⚡ Download This Page / Video</span>
  </button>

  <button id="openAppBtn" class="btn-main" style="background: rgba(30, 41, 59, 0.85); border-color: #334155; margin-top: 6px;">
    <span>🖥️ Open G1DM Desktop</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
